name: Windows — compilation et installateur

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # publication de l'installateur dans les Releases (tags v*)

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compilation (vérification)
        run: dotnet build src/FileWheel.App/FileWheel.App.csproj -c Release

      - name: Publication autonome win-x64
        run: dotnet publish src/FileWheel.App/FileWheel.App.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o publish

      - name: NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }

      - name: Installateur FileWheel-Setup
        shell: pwsh
        run: |
          $v = ([xml](Get-Content Directory.Build.props -Raw)).SelectSingleNode('//Version').InnerText.Trim()
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /V2 "/DVERSION=$v" "/DPUBLISH_DIR=$PWD\publish" "/DOUTFILE=$PWD\FileWheel-Setup-$v.exe" "/DICON=$PWD\assets\filewheel.ico" "/DSIDE_BITMAP=$PWD\assets\installer-side.bmp" installer\FileWheel.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item FileWheel-Setup-*.exe | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: FileWheel-Setup
          path: FileWheel-Setup-*.exe

      - name: Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FileWheel-Setup-*.exe
          generate_release_notes: true
